[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gala-agent"
version = "0.1.0"
description = "Agentic RAG assistant for planning and supporting a luxury gala event."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "requests>=2.31.0",
  "streamlit>=1.39.0",
  "markdownify>=1.0.0",
  "langchain>=1.0.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-community>=0.0.1",
  "langchain-ollama>=0.0.1",
  "rank_bm25>=0.2.2",
  "ddgs>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
